[metadata]
name = nionswift-usim
version = 5.4.2
author = Nion Software
author_email = swift@nion.com
description = A Nion Swift package to simulate a STEM microscope, scanner, and cameras.
long_description = file: README.rst, CHANGES.rst
url = https://github.com/nion-software/nionswift-usim
license = GPL-3.0-only
classifiers =
    Development Status :: 5 - Production/Stable
    License :: OSI Approved :: GNU General Public License v3 (GPLv3)
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13

[options]
packages = find_namespace:
python_requires = >=3.11
install_requires =
   nionswift-instrumentation >=23.3,<24.0
   trimesh >=4.4
   rtree >=1.3
   gemmi >=0.7,<0.8

[options.extras_require]
gpu =
    cupy-cuda12x[ctk] >=14.2,<15

[options.package_data]
nion.usim_device =
    py.typed
    samples/*.stl
    samples/*.cif
    samples/*.json
nionswift_plugin.usim =
    manifest.json

[options.packages.find]
include =
    nion.usim_device
    nionswift_plugin
    nionswift_plugin.usim
    nionswift_plugin.usim.test
